# Dependency Review
# Blocks PRs that introduce dependencies with known vulnerabilities.
# Runs on every PR that touches package manifests.
# Docs: https://docs.github.com/en/code-security/supply-chain-security/understanding-your-software-supply-chain/about-dependency-review

name: Dependency Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Scan Dependencies for Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          # Fail on vulnerabilities of this severity or higher
          fail-on-severity: moderate
          # Also flag licenses that are problematic
          deny-licenses: "GPL-3.0, AGPL-3.0"
          # Comment a summary on the PR
          comment-summary-in-pr: always
