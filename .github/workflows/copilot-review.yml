# Copilot-Powered PR Review
# Triggers GitHub Copilot to automatically review every pull request.
# Docs: https://docs.github.com/en/copilot/using-github-copilot/code-review/using-copilot-code-review

name: Copilot PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  copilot-review:
    name: Copilot Code Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Request Copilot Review
        uses: github/copilot-code-review@v1
        with:
          # "auto" = Copilot reviews every PR automatically
          # "manual" = Copilot only reviews when requested via @copilot in a comment
          mode: "auto"
